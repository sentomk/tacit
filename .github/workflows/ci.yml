name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpp:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        preset: [debug, release, asan]
    env:
      CXX: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Check benchmark harness
        if: matrix.preset == 'release'
        run: ./build/release/benchmarks/zk_snark_bench --benchmark_min_time=0.01s

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -c "import zk_snark_ref"
      - run: ruff check python
      - name: Run reference tests once added
        shell: bash
        run: |
          if find python/tests -name 'test_*.py' -print -quit | grep -q .; then
            python -m pytest
          else
            echo "P0: reference tests will be added with the first model."
          fi
